<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="工程案件、團隊任務與 KPI 的彙整管控台。">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex">
  <title>專案管控台｜Rob</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="管控台">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="control.css">
  <script src="control.js" defer></script>
</head>
<body class="control">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="site-header">
    <nav class="nav shell" aria-label="主要導覽">
      <a class="brand" href="index.html" aria-label="回到首頁">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>ROB / CONTROL</span>
      </a>
      <div class="c-actions">
        <button class="c-btn" type="button" data-action="export">匯出備份</button>
        <button class="c-btn" type="button" data-action="import">匯入</button>
        <button class="c-btn" type="button" data-action="menu" aria-haspopup="true">更多</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </nav>
    <div class="c-tabs shell" role="tablist" aria-label="管控台分頁">
      <button role="tab" data-tab="overview" aria-selected="true">總覽</button>
      <button role="tab" data-tab="projects" aria-selected="false">案件</button>
      <button role="tab" data-tab="tasks" aria-selected="false">任務</button>
      <button role="tab" data-tab="team" aria-selected="false">團隊</button>
      <button role="tab" data-tab="kpis" aria-selected="false">KPI</button>
      <button role="tab" data-tab="report" aria-selected="false">週報</button>
    </div>
  </header>

  <main id="main" class="shell c-main">
    <p class="c-banner" id="banner" hidden></p>
    <div id="view"></div>
    <p class="c-privacy">資料只存在這台裝置的瀏覽器，不會上傳到任何伺服器。換裝置或清除瀏覽器資料前，請先按「匯出備份」。</p>
  </main>

  <button class="c-fab" type="button" data-add="tasks" aria-label="快速新增任務">＋</button>

  <dialog id="dialog" class="c-dialog">
    <form method="dialog" id="form">
      <h2 id="form-title"></h2>
      <div id="form-fields" class="c-fields"></div>
      <div class="c-form-actions">
        <button class="c-btn danger" type="button" id="form-delete">刪除</button>
        <span class="c-spacer"></span>
        <button class="c-btn" type="button" id="form-cancel">取消</button>
        <button class="c-btn solid" type="submit">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="menu" class="c-dialog c-menu">
    <h2>資料管理</h2>
    <button class="c-btn" type="button" data-action="sample">載入範例資料</button>
    <button class="c-btn danger" type="button" data-action="clear">清空全部資料</button>
    <button class="c-btn" type="button" data-action="close-menu">關閉</button>
  </dialog>
</body>
</html>
